apply plugin: 'com.android.application'


android {
    namespace 'com.cam.paygo'
    compileSdk 34

    defaultConfig {
        applicationId "com.cam.paygo"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            storeFile file('key/com.pax.innov.apk.sign')
            storePassword 'com.pax.innov.apk.sign'
            keyAlias 'com.pax.innov.apk.sign'
            keyPassword 'com.pax.innov.apk.sign'
        }
    }

    buildFeatures{
        buildConfig = true
    }

    buildTypes {
        release {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "SERVER_URL", "\"https://uat.f8tms.veriphy.io/\""
            buildConfigField "String", "EMAIL", "\"dhananjay.g@f8payments.com\""
            buildConfigField "String", "PASSWORD", "\"Dhananjay@1234\""
            buildConfigField "boolean", "ENABLE_TEST_ORDER_ID", "false"
            buildConfigField "boolean", "ENABLE_TEST_LOG_UPLOAD", "false"
            signingConfig signingConfigs.release
        }

        debug {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "SERVER_URL", "\"https://uat.f8tms.veriphy.io/\""
            buildConfigField "String", "EMAIL", "\"dhananjay.g@f8payments.com\""
            buildConfigField "String", "PASSWORD", "\"Dhananjay@1234\""
            buildConfigField "boolean", "ENABLE_TEST_ORDER_ID", "true"
            buildConfigField "boolean", "ENABLE_TEST_LOG_UPLOAD", "true"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation files('libs/NeptuneLiteApi_V4.17.00_20250808.jar')

    // MQTT library JAR (renamed from com.cam.mqtt-1.0.0.jar)
    // fileTree above already picks it up; keep explicit for clarity
    implementation files('libs/cloudlayer-1.0.0.jar')
    // Required at runtime because the MQTT JAR is thin (does not shade Paho/Gson)
    implementation libs.org.eclipse.paho.client.mqttv3
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation "androidx.core:core:1.12.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation libs.volley
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
}